name: Deploy Lab To Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VERCEL_ORG_ID: team_4idZYM1vtyLD2utSda9Sl8sy
  VERCEL_PROJECT_ID: prj_lrIsjCLBflosQdFRMn0A0VsLnlrN

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Link correct Vercel project
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<'EOF'
          {"projectId":"prj_lrIsjCLBflosQdFRMn0A0VsLnlrN","orgId":"team_4idZYM1vtyLD2utSda9Sl8sy","projectName":"training-lab"}
          EOF

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || vars.VERCEL_TOKEN }}
        run: |
          bunx vercel deploy --prod --yes \
            --token="$VERCEL_TOKEN" \
            --scope=arach
